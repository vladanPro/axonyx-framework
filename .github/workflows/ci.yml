name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  msrv:
    name: Rust 1.82 MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust 1.82
        uses: dtolnay/rust-toolchain@1.82.0

      - name: Check workspace on declared MSRV
        run: cargo check --workspace --all-targets --all-features

  framework:
    name: Framework Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test framework workspace
        run: cargo test

      - name: Smoke static site template
        shell: pwsh
        run: ./scripts/smoke-core-loop.ps1 -Template site

      - name: Smoke static blog template
        shell: pwsh
        run: ./scripts/smoke-core-loop.ps1 -Template blog

      - name: Smoke static docs template
        shell: pwsh
        run: ./scripts/smoke-core-loop.ps1 -Template docs

      - name: Smoke compiled action runtime
        shell: pwsh
        run: ./scripts/smoke-compiled-actions.ps1

  runtime:
    name: Runtime Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test runtime workspace
        working-directory: vendor/axonyx-runtime
        run: cargo test

  postgres:
    name: Postgres CLI Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: axonyx_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d axonyx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AXONYX_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/axonyx_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Postgres check and schema pull
        run: cargo test -p cargo-axonyx tests::postgres_db_check_and_pull_run_when_test_url_is_configured -- --exact

  package:
    name: Package Rehearsal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Package runtime leaf crate
        working-directory: vendor/axonyx-runtime
        run: |
          cargo package -p axonyx-macros --no-verify

      - name: Check runtime package contents
        working-directory: vendor/axonyx-runtime
        run: |
          cargo package -p axonyx-core --list
          cargo package -p axonyx-runtime --list

      - name: Check framework package contents
        run: |
          cargo package -p create-axonyx --list
          cargo package -p cargo-axonyx --list
